spring:
  datasource:
    url: jdbc:h2:mem:habit_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

codex-data-agent:
  storage:
    raw-path: target/codex-agent-test/raw
    imports-path: target/codex-agent-test/imports
    processed-path: target/codex-agent-test/processed
    profiles-path: target/codex-agent-test/profiles
    recommendations-path: target/codex-agent-test/recommendations
  sources:
    app-usage-summary:
      sample-file: data/imports/app_usage_sample.json
    browser-history:
      sample-file: data/imports/browser_history_sample.json

assistant:
  user-id: test-user
  daily-cron: "-"
  keywords:
    - AI
    - Java
    - 测试
  history-import:
    enabled: false
    cron: "-"
    directory: ./target/test-imports/history
    archive-directory: ./target/test-imports/history/archive
    failed-directory: ./target/test-imports/history/failed
    file-pattern: "*.csv"
  collectors:
    rss:
      enabled: false
      feeds: []
    json-api:
      enabled: false
      sources: []
    x:
      enabled: false
      bearer-token:
      max-results: 10
  feishu:
    webhook-url:
  recommendation-refresh:
    activity-window-hours: 24
    medium-activity-threshold: 2
    high-activity-threshold: 5
    low-activity-hours: 12
    medium-activity-hours: 12
    high-activity-hours: 12
  behavior:
    rabbitmq:
      enabled: false
      exchange: habit.behavior.events
      routing-key: behavior.events.created
  profile:
    cache:
      redis:
        enabled: false
        ttl-hours: 24
  local-worker:
    enabled: false
    base-url: http://localhost:8080
    script-path: scripts/codex_query_worker.py
    python-command: py -3
    limit: 20
