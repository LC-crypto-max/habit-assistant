spring:
  config:
    import: optional:file:./config/application-mysql-local.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:habit_assistant}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      initialization-fail-timeout: 5000
      maximum-pool-size: 8
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/mysql/schema.sql
      continue-on-error: false

management:
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

assistant:
  history-import:
    directory: ./imports/history
    archive-directory: ./imports/history/archive
    failed-directory: ./imports/history/failed
  profile:
    cache:
      redis:
        enabled: ${PROFILE_REDIS_ENABLED:false}
        ttl-hours: ${PROFILE_REDIS_TTL_HOURS:24}
