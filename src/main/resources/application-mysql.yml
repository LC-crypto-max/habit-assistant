spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:habit_assistant}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:habit}
    password: ${MYSQL_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

management:
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

assistant:
  history-import:
    directory: ./imports/history
    archive-directory: ./imports/history/archive
    failed-directory: ./imports/history/failed
  profile:
    cache:
      redis:
        enabled: ${PROFILE_REDIS_ENABLED:false}
        ttl-hours: ${PROFILE_REDIS_TTL_HOURS:24}
