server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    default: mysql
  config:
    import: optional:classpath:codex-data-agent.yml
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    show-sql: false

logging:
  charset:
    console: UTF-8
    file: UTF-8

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

assistant:
  user-id: me
  daily-cron: "0 0 8 * * ?"
  keywords:
    - AI
    - Java
    - 编程
    - 科技
  history-import:
    enabled: false
    cron: "0 30 * * * ?"
    directory: ./imports/history
    archive-directory: ./imports/history/archive
    failed-directory: ./imports/history/failed
    file-pattern: "*.csv"
  collectors:
    rss:
      enabled: false
      feeds:
        # 示例：配置你自己合法订阅的 RSS/Atom feed。
        # - platform: bilibili-rss
        #   url: https://example.com/bilibili/rss.xml
        #   tags: [B站, 视频]
    json-api:
      enabled: false
      sources:
        # 示例：适配返回 items/title/link/snippet 的官方或自建 JSON API。
        # - platform: web-search
        #   endpoint-template: "https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q={query}"
        #   results-pointer: /items
        #   title-pointer: /title
        #   url-pointer: /link
        #   summary-pointer: /snippet
        #   tags: [搜索]
    x:
      enabled: false
      bearer-token: ${X_BEARER_TOKEN:}
      max-results: 10
  feishu:
    webhook-url: ${FEISHU_WEBHOOK_URL:}
  recommendation-refresh:
    activity-window-hours: 24
    medium-activity-threshold: 20
    high-activity-threshold: 80
    low-activity-hours: 12
    medium-activity-hours: 12
    high-activity-hours: 12
  behavior:
    rabbitmq:
      enabled: false
      exchange: habit.behavior.events
      routing-key: behavior.events.created
  profile:
    cache:
      redis:
        enabled: false
        ttl-hours: 24
  local-worker:
    enabled: true
    base-url: http://localhost:8080
    script-path: scripts/codex_query_worker.py
    python-command: auto
    limit: 20
  auth:
    enabled: false
    users:
      - user-id: alice
        password: ${HABIT_ALICE_PASSWORD:alice123}
        admin: false
      - user-id: bob
        password: ${HABIT_BOB_PASSWORD:bob123}
        admin: false
      - user-id: admin
        password: ${HABIT_ADMIN_PASSWORD:admin123}
        admin: true
