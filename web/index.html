<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>习惯助手 - 数据提交</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --surface: #ffffff;
      --line: #e2e8f0;
      --text: #182230;
      --muted: #667085;
      --primary: #0f766e;
      --primary-hover: #0b5f59;
      --danger: #b42318;
      --success-bg: #ecfdf3;
      --danger-bg: #fef3f2;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    main {
      max-width: 880px;
      margin: 20px auto 40px;
      padding: 0 20px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #344054;
      font-weight: 650;
      font-size: 13px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 11px;
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus, textarea:focus {
      border-color: #5eead4;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .12);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 7px;
      background: var(--primary);
      color: #fff;
      font-weight: 750;
      padding: 11px 16px;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .65;
    }

    .message {
      min-height: 42px;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--muted);
      padding: 11px 12px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.ok {
      background: var(--success-bg);
      color: var(--primary);
    }

    .message.error {
      background: var(--danger-bg);
      color: var(--danger);
    }

    @media (max-width: 720px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <p class="eyebrow">Habit Assistant</p>
      <h1>协作数据提交</h1>
      <p>用于小规模团队提交习惯打卡数据，后端会保存记录并用于后续画像分析。</p>
    </div>
  </header>

  <main>
    <section class="card toolbar">
      <p>需要查看画像、推荐和采集结果时，可以进入完整后台。</p>
      <a href="/assistant/" target="_blank" rel="noreferrer">打开画像与推荐后台</a>
    </section>

    <section class="card">
      <form id="habitForm">
        <div class="grid-2">
          <label>
            用户昵称
            <input id="nickname" name="nickname" maxlength="40" required placeholder="例如：小李">
          </label>
          <label>
            打卡日期
            <input id="recordDate" name="recordDate" type="date" required>
          </label>
        </div>
        <label>
          习惯名称
          <input id="habitName" name="habitName" maxlength="80" required placeholder="例如：阅读、运动、英语打卡">
        </label>
        <label>
          打卡内容
          <textarea id="content" name="content" maxlength="500" required placeholder="写下今天完成了什么"></textarea>
        </label>
        <label>
          备注
          <input id="remark" name="remark" maxlength="300" placeholder="可选">
        </label>
        <button id="submitBtn" type="submit">提交打卡</button>
        <div id="message" class="message" role="status">填写表单后点击提交，成功后会返回记录编号。</div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("habitForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    document.getElementById("recordDate").valueAsDate = new Date();

    function show(text, type = "") {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function friendlyError(error) {
      const message = error && error.message ? error.message : "提交失败，请稍后重试。";
      if (message.includes("Failed to fetch")) {
        return "无法连接后端服务，请确认 Spring Boot 服务已启动。";
      }
      if (message.includes("VALIDATION_ERROR")) {
        return "表单内容不完整，请检查必填项和长度限制。";
      }
      return message.length > 120 ? "提交失败，请查看后端日志。" : message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "提交中...";
      show("正在提交，请稍候...");
      const body = {
        nickname: form.nickname.value.trim(),
        habitName: form.habitName.value.trim(),
        content: form.content.value.trim(),
        recordDate: form.recordDate.value,
        remark: form.remark.value.trim()
      };

      try {
        const response = await fetch("/api/habits/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(body)
        });
        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.message || data.error || "提交失败");
        }
        show(`提交成功，记录编号：${data.data.id}`, "ok");
        form.content.value = "";
        form.remark.value = "";
      } catch (error) {
        show(friendlyError(error), "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "提交打卡";
      }
    });
  </script>
</body>
</html>
